spring:
  application:
    name: worklyn
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  cache:
    type: redis
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173}
  crawler:
    allowed-domains: ${APP_CRAWLER_ALLOWED_DOMAINS:careers.example.com,jobs.techcorp.io}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-response-size-bytes: 2097152
  shortlink:
    base-url: ${APP_SHORTLINK_BASE_URL:http://localhost:8080/s/}
    default-ttl-days: 30
  idgen:
    datacenter-id: ${APP_IDGEN_DATACENTER_ID:1}
    worker-id: ${APP_IDGEN_WORKER_ID:1}
  hashing:
    virtual-nodes: 150
  rewind:
    lock-lease-seconds: 10
    max-retries: 3
  ratelimit:
    authenticated:
      capacity: 100
      refill-rate: 10.0
    public:
      capacity: 20
      refill-rate: 2.0
    expensive:
      capacity: 5
      refill-rate: 0.2
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
